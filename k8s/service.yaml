apiVersion: v1
kind: Service
metadata:
  name: cloudnotes               # commands reference svc/cloudnotes
  labels:
    app: cloudnotes
spec:
  type: ClusterIP                # reachable via `kubectl port-forward` (see below)
  selector:
    app: cloudnotes              # <-- MUST match the pod labels in the Deployment
  ports:
    - name: http
      port: 80                   # the Service's own port (port-forward 8080:80)
      targetPort: 8080           # ===> must equal the container's containerPort
      protocol: TCP

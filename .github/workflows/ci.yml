name: CloudNotes CI/CD

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Run CloudNotes tests
        run: npm test

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudnotes:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cloudnotes:${{ github.sha }}
      - name: Prepare deployment manifest
        run: |
          sed -i "s|image:.*cloudnotes:.*|image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/cloudnotes:${{ github.sha }}|" k8s/deployment.yaml
          echo "===== Updated k8s/deployment.yaml ====="
          cat k8s/deployment.yaml
      - name: Upload updated manifest
        uses: actions/upload-artifact@v4
        with:
          name: cloudnotes-k8s-manifest
          path: k8s/deployment.yaml
